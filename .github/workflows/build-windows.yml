name: Build Windows installer

on:
  push:
    branches: [desktop-soundwave]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Quetzalcoatl-1-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
